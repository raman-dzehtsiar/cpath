# SPDX-License-Identifier: MIT

name: Build

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, test, and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy llvm-tools-preview

      - name: Cache dependencies and SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.sonar/cache
          key: ${{ runner.os }}-cargo-sonar-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sonar-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint and generate Clippy report
        run: |
          mkdir -p target/ci
          cargo clippy --locked --all-targets --all-features --message-format=json -- -D warnings | tee target/ci/clippy.json

      - name: Build release binary
        run: cargo build --locked --release --all-features

      - name: Install coverage tool
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Run tests with coverage
        run: >-
          cargo llvm-cov --locked --all-targets --all-features
          --lcov --output-path target/ci/lcov.info

      # Stable Rust coverage does not include doctests; run them separately.
      - name: Run documentation tests
        run: cargo test --locked --all-features --doc

      - name: Run Python tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      # Fork PRs and Dependabot do not receive the repository's SONAR_TOKEN.
      - name: Analyze with SonarCloud
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
