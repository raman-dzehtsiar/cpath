# SPDX-License-Identifier: MIT

name: Produce binaries

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Check ${{ matrix.target }}
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          rustup target add "$BUILD_TARGET"

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo clippy --locked --target "$BUILD_TARGET" --all-targets --all-features -- -D warnings

      - name: Run tests
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --target "$BUILD_TARGET" --all-targets --all-features
          cargo test --locked --target "$BUILD_TARGET" --all-features --doc

  binaries:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: cpath
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: cpath.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: cpath
          - os: macos-15
            target: aarch64-apple-darwin
            binary: cpath
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain
          rustup target add "$BUILD_TARGET"

      - name: Build release binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --all-features --bin cpath --target "$BUILD_TARGET"

      # Direct uploads use the filename as the artifact name, so include the target
      # and run attempt to keep matrix jobs and reruns distinct.
      - name: Prepare executable
        id: executable
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          executable="dist/cpath-$BUILD_TARGET-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT${BINARY_NAME#cpath}"
          cp "target/$BUILD_TARGET/release/$BINARY_NAME" "$executable"
          echo "path=$executable" >> "$GITHUB_OUTPUT"

      - name: Smoke-test packaged executable
        env:
          EXECUTABLE_PATH: ${{ steps.executable.outputs.path }}
        run: |
          "$EXECUTABLE_PATH" --version
          "$EXECUTABLE_PATH" --help
          "$EXECUTABLE_PATH" tests/fixtures/cognitive --metrics CC,MI,LOC --pretty
          "$EXECUTABLE_PATH" gate HEAD HEAD --pretty

      - name: Upload executable
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ${{ steps.executable.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
