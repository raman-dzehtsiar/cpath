[package]
name = "cpath"
version = "0.1.0"
edition = "2021"
authors = ["Raman Dzehtsiar"]
license = "MIT"
description = "Local, offline codebase intelligence tool that highlights where human review is needed."
publish = false

# Use a dev-only Cargo target for tooling kept outside the product source tree.
[[example]]
name = "inspect"
path = "tools/inspect.rs"

[[example]]
name = "failure_audit"
path = "tools/failure_audit.rs"

[[example]]
name = "cognitive_ranking_experiment"
path = "tools/cognitive_ranking_experiment.rs"

[[example]]
name = "syntax_signal_experiment"
path = "tools/syntax_signal_experiment.rs"

[dependencies]
crossbeam-channel = "0.5"
globset = "0.4"
ignore = "0.4"
tree-sitter = "0.25"
# Patched upstream grammar; see vendor/tree-sitter-c-sharp/CPATH.md.
tree-sitter-c-sharp = { path = "vendor/tree-sitter-c-sharp" }
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = { path = "vendor/tree-sitter-cpp" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
