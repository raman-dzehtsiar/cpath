# SPDX-License-Identifier: MIT

sonar.projectKey=raman-dzehtsiar-cpath
sonar.organization=raman-dzehtsiar
sonar.projectName=cpath
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Analyze first-party Rust code, including Cargo's developer-tool targets.
# Vendored grammars, generated artifacts, and input fixtures are outside scope.
sonar.sources=src,tools
sonar.inclusions=**/*.rs
sonar.tests=tests
sonar.test.inclusions=tests/**/*.rs

sonar.rust.lcov.reportPaths=target/ci/lcov.info
sonar.rust.clippyReport.reportPaths=target/ci/clippy.json
